name: Knowledge Graph website benchmark

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "kg_test.py"
      - ".github/workflows/kg-benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "kg_test.py"
      - ".github/workflows/kg-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run 10-business benchmark
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 kg_test.py

      - name: Upload JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kg-benchmark-results
          path: kg_results.json
          if-no-files-found: warn
